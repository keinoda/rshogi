# vast.ai 用 base image (infra/vast/Dockerfile) を build して GHCR へ push する。
#
# - trigger: infra/vast/Dockerfile か本 workflow の変更 push、または手動 (workflow_dispatch)
# - push 先: ghcr.io/<owner>/shogi-lab:cuda129-trt1011 (+ :latest)
# - 認証は GITHUB_TOKEN (packages: write) で完結。追加 secret 不要
# - 初回 push 後、パッケージは private になるので GitHub の Packages 設定で
#   Public に変更する (vast.ai から匿名 pull するため。private コードは含まれない)
name: vast-image

on:
  workflow_dispatch:
  push:
    paths:
      - 'infra/vast/Dockerfile'
      - '.github/workflows/vast-image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: vast-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # CUDA devel + TensorRT のイメージは ~16GB。runner の空きを確保する
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: infra/vast
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shogi-lab:cuda129-trt1011
            ghcr.io/${{ github.repository_owner }}/shogi-lab:latest

      - name: Image digest / size
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/shogi-lab:cuda129-trt1011
